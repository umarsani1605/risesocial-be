auth_enabled: false

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

server:
  http_listen_port: 3100
  grpc_listen_port: 0

schema_config:
  configs:
    - from: 2022-06-06
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compactor_ring:
    kvstore:
      store: inmemory

limits_config:
  retention_period: 744h
